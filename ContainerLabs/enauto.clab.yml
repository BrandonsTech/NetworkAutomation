name: enauto
topology:
  nodes:
    r1:
      kind: cisco_c8000v
      image: vrnetlab/cisco_c8000v:17.16.01a
      startup-config: configs/r1.cfg
    r2:
      kind: cisco_c8000v
      image: vrnetlab/cisco_c8000v:17.16.01a
      startup-config: configs/r2.cfg
    r3:
      kind: cisco_c8000v
      image: vrnetlab/cisco_c8000v:17.16.01a
    telemetry:
      kind: linux
      image: telegraf:latest
      binds: [ ./telegraf.conf:/etc/telegraf/telegraf.conf:ro ]
    #ztp:
    #  kind: linux
    #  image: nginx:alpine
   #   binds: [ ./ztp-www:/usr/share/nginx/html:ro ]
  links:
    - endpoints: ["r1:Gi2", "r2:Gi2"]
    - endpoints: ["r2:Gi3", "r3:Gi2"]
