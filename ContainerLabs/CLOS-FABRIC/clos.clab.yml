# Reference lab for the Network Automation & NetDevOps roadmap
# 2x Nokia SR Linux spines, 4x Arista cEOS leaves, 2x FRRouting WAN edges, 2x Linux hosts.
#
# Deploy:   sudo containerlab deploy -t topology.clab.yml
# Destroy:  sudo containerlab destroy -t topology.clab.yml --cleanup
#
# The fabric starts UNCONFIGURED on purpose (management access only).
# Phases 3-4 build the underlay with Nornir/Ansible from your data model.
#
# Image tags: override with env vars instead of editing this file, e.g.
#   export CEOS_IMAGE=ceos:4.33.1F
# Pin exact versions once the lab works, so CI rebuilds the same lab every time.
#
# ---------------------------------------------------------------------------
# Intended addressing plan (for your Phase 2 YAML data model, not applied here)
#   Loopbacks:      10.255.0.0/24   spine1 .1, spine2 .2, leaf1-4 .11-.14, edge1-2 .21-.22
#   P2P underlay:   10.0.0.0/24 carved into /31s, one per fabric link
#   ASNs:           spines 65000, leaf1-4 65001-65004, edge1-2 65101-65102
#   Host subnets:   host1 10.100.1.0/24 (gw .1 on leaf3), host2 10.100.2.0/24 (gw .1 on leaf4)
# ---------------------------------------------------------------------------

name: netdevops-lab

mgmt:
  network: clab                 # attach NetBox, CI runner, Prometheus etc. to this docker network
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d3l
    arista_ceos:
      image: ceos:4.36.3M   # must match the tag you imported with `docker import`
    linux:
      image: ${HOST_IMAGE:=ghcr.io/hellt/network-multitool:latest}

  nodes:
    # ---------------- Spines (Nokia SR Linux) ----------------
    spine1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.11
      labels: {role: spine, site: lab, vendor: nokia}
    spine2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.20.20.12
      labels: {role: spine, site: lab, vendor: nokia}

    # ---------------- Leaves (Arista cEOS) ----------------
    leaf1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.21
      labels: {role: border-leaf, site: lab, vendor: arista}
    leaf2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.22
      labels: {role: border-leaf, site: lab, vendor: arista}
    leaf3:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.23
      labels: {role: server-leaf, site: lab, vendor: arista}
    leaf4:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.24
      labels: {role: server-leaf, site: lab, vendor: arista}

    # ---------------- WAN edge (FRRouting) ----------------
    edge1:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      mgmt-ipv4: 172.20.20.31
      labels: {role: wan-edge, site: lab, vendor: frr}
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/edge1.conf:/etc/frr/frr.conf
    edge2:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      mgmt-ipv4: 172.20.20.32
      labels: {role: wan-edge, site: lab, vendor: frr}
      binds:
        - frr/daemons:/etc/frr/daemons
        - frr/edge2.conf:/etc/frr/frr.conf

    # ---------------- Test hosts (Linux) ----------------
    host1:
      kind: linux
      mgmt-ipv4: 172.20.20.41
      labels: {role: host, site: lab}
      exec:
        - ip addr add 10.100.1.10/24 dev eth1
        - ip route add 10.100.0.0/16 via 10.100.1.1
    host2:
      kind: linux
      mgmt-ipv4: 172.20.20.42
      labels: {role: host, site: lab}
      exec:
        - ip addr add 10.100.2.10/24 dev eth1
        - ip route add 10.100.0.0/16 via 10.100.2.1

  links:
    # Spine1 -> every leaf (leaf port eth1)
    - endpoints: ["spine1:e1-1", "leaf1:eth1"]
    - endpoints: ["spine1:e1-2", "leaf2:eth1"]
    - endpoints: ["spine1:e1-3", "leaf3:eth1"]
    - endpoints: ["spine1:e1-4", "leaf4:eth1"]
    # Spine2 -> every leaf (leaf port eth2)
    - endpoints: ["spine2:e1-1", "leaf1:eth2"]
    - endpoints: ["spine2:e1-2", "leaf2:eth2"]
    - endpoints: ["spine2:e1-3", "leaf3:eth2"]
    - endpoints: ["spine2:e1-4", "leaf4:eth2"]
    # Border leaves -> WAN edge
    - endpoints: ["leaf1:eth3", "edge1:eth1"]
    - endpoints: ["leaf2:eth3", "edge2:eth1"]
    # Server leaves -> hosts
    - endpoints: ["leaf3:eth3", "host1:eth1"]
    - endpoints: ["leaf4:eth3", "host2:eth1"]