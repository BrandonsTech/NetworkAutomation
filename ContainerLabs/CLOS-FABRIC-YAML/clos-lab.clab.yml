---
name: clos-lab

mgmt:
  network: netdevops-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: ceos
    image: ceos:4.36.3M
    # TIP: If you don't have the Arista cEOS image imported yet, comment out the two lines
    # above and uncomment the two lines below to pull Nokia SR Linux automatically:
    # kind: nokia_srlinux
    # image: ghcr.io/nokia/srlinux:latest

  nodes:
    spine1:
      mgmt-ipv4: 172.20.20.11
      labels:
        role: spine
        asn: "65000"
    spine2:
      mgmt-ipv4: 172.20.20.12
      labels:
        role: spine
        asn: "65000"
    leaf1:
      mgmt-ipv4: 172.20.20.21
      labels:
        role: leaf
        asn: "65101"
    leaf2:
      mgmt-ipv4: 172.20.20.22
      labels:
        role: leaf
        asn: "65102"
    leaf3:
      mgmt-ipv4: 172.20.20.23
      labels:
        role: leaf
        asn: "65103"
    leaf4:
      mgmt-ipv4: 172.20.20.24
      labels:
        role: leaf
        asn: "65104"

  links:
    # Spine 1 to Leafs 1-4
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]

    # Spine 2 to Leafs 1-4
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]
